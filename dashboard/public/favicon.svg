<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rutenettet, som er hele ideen: fire ruter du selv bestemmer innholdet i.
       Fargene er hardkodet her fordi et favicon ikke har tilgang til sidens
       CSS-variabler; verdiene er Papir-modusens paper og accent. -->
  <rect width="32" height="32" fill="#faf7f2" />
  <g fill="none" stroke="#a3391c" stroke-width="2">
    <rect x="5" y="5" width="9" height="9" />
    <rect x="18" y="5" width="9" height="9" />
    <rect x="5" y="18" width="9" height="9" />
    <rect x="18" y="18" width="9" height="9" />
  </g>
</svg>
